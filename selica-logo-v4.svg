<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .word {
        font-family: 'Didot', 'Bodoni MT', 'Playfair Display', Georgia, serif;
        font-weight: 400;
        font-size: 110px;
        letter-spacing: 4px;
        fill: #1C1A17;
      }
      .sub {
        font-family: 'Didot', 'Bodoni MT', 'Playfair Display', Georgia, serif;
        font-size: 17px;
        letter-spacing: 6px;
        fill: #8A8580;
      }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="420" fill="#FDFCFA"/>

  <!-- wordmark: only S capitalized -->
  <text x="400" y="235" text-anchor="middle" class="word">Selica</text>

  <!-- QF STUDENT, positioned below-right of the wordmark -->
  <text x="470" y="278" text-anchor="start" class="sub">QF STUDENT</text>
</svg>
